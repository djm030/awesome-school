<div class="formset-row">
  {% for hidden in row.hidden_fields %}{{ hidden }}{% endfor %}
  {{ row.non_field_errors }}
  {% for field in row.visible_fields %}{% if field.name != "DELETE" %}<div class="field">{{ field.as_field_group }}</div>{% endif %}{% endfor %}
  {% if row.instance.pk %}<label class="check">{{ row.DELETE }} 이 행 삭제</label>{% endif %}
</div>
