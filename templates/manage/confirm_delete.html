{% extends "manage/base.html" %}
{% block title %}{{ kind }} 삭제 | 히어로스쿨{% endblock %}

{% block manage %}
<div class="form-panel narrow">
  <p class="eyebrow">{{ kind }} 삭제</p>
  <h1>{{ target }}</h1>
  {% if blocked %}
  <p class="error">{{ blocked }}</p>
  <div class="actions"><a class="btn btn-ghost" href="{{ back }}">돌아가기</a></div>
  {% else %}
  <p>{{ warning }}</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button class="btn btn-danger">삭제</button>
    <a class="btn btn-ghost" href="{{ back }}">돌아가기</a>
  </form>
  {% endif %}
</div>
{% endblock %}
