{% extends "base.html" %}
{% block title %}찾아가는 교육 | 히어로스쿨{% endblock %}

{% block content %}
<section class="section">
  <div class="container">
    <p class="eyebrow">찾아가는 교육 · 히어로코치가 학교로 갑니다</p>
    <h1>히어로스쿨 교육</h1>
    <ul class="cards cards-3">
      {% for course in courses %}
      <li class="card course-card">
        <img src="{{ course.image.url }}" alt="{{ course.name }} 대표 이미지" width="640" height="715" loading="lazy">
        <h2><a href="{% url 'course-detail' course.slug %}">{{ course.name }}</a></h2>
        <p>{{ course.summary }}</p>
      </li>
      {% endfor %}
    </ul>
  </div>
</section>
{% endblock %}
